            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .hacker-text {
            font-family: 'Courier New', monospace;

        .enter-btn {
            font-family: 'Courier New', monospace;

            color: white;
            cursor: pointer;
            opacity: 0;
            margin-top: 30px;
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            animation: fadeInEnter 1s ease 2.5s forwards;
        }
        .enter-btn:hover {
            background: rgba(255,255,255,0.1);
            letter-spacing: 2px;
            color: #00ff9d;
            border-color: #00ff9d;
        }
        @keyframes hackerGlow {
            to { opacity: 1; }
        }
        @keyframes fadeInEnter {
            to { opacity: 1; }
        }
        #skip-preloader:hover {
            background: rgba(255,255,255,0.7);
            transform: scale(1.05);
        }
        /* Video ad overlay */
        #video-ad-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 1000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #video-ad-overlay video {
            max-width: 100%;
            max-height: 85vh;
            background: #000;
        }
        #ad-skip-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            z-index: 1000001;
        }
        #ad-skip-btn:hover {
            background: rgba(0,0,0,0.9);
        }
        #ad-loading {
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 16px;
        }
    </style>

<body>

<script>
const VAST_AD_TAG = 'https://windy-imagination.com/dnm_F.zSd/GrNrvVZQG/UN/ZeWmd9RunZ/UMl/k/PlTBcH1cNLTsUC5PMiDmkatuNAzWU/1dNETgk/xzM/yZZFsVaiW/1rpPdvDe0/xj';

function showPreloader() {
    // Skip preloader if user is coming back with back button
    if (performance.navigation.type === 2 ||
        performance.getEntriesByType('navigation')[0]?.type === 'back_forward') {
        window.location.href = 'home.html';
        return;
    }

    const preloader = document.createElement('div');
    preloader.id = 'homework-preloader';
    preloader.style.cssText = `
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: linear-gradient(rgba(15,18,32,0.95), rgba(15,18,32,0.95)), 
                    url("https://wallpapers.com/images/hd/dark-blue-aesthetic-calm-lake-oprig3tpij9dxsic.jpg");
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        flex-direction: column;
        opacity: 1;
        transition: opacity 1.2s ease;
    `;

    preloader.innerHTML = `
        <img src="https://i.imgur.com/QXhoS1t.png"
             alt="Homework Planet"
             style="width: 540px; margin-bottom: 40px;
                    opacity: 0; transform: translateY(-150px);
                    animation: dropLogo 1.6s ease forwards;">
        <div class="hacker-text">THE BEST UNBLOCKED GAMES</div>
      
        <div id="enter-site" class="enter-btn">CLICK TO ENTER</div>
        <button id="skip-preloader"
                style="position: absolute;
                       bottom: 40px;
                       right: 40px;
                       background: rgba(255,255,255,0.5);
                       color: white;
                       border: none;
                       padding: 10px 24px;
                       border-radius: 9999px;
                       font-size: 14px;
                       font-weight: 600;
                       cursor: pointer;
                       backdrop-filter: blur(8px);
                       transition: all 0.3s ease;
                       box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
            SKIP
        </button>
    `;

    document.body.appendChild(preloader);

    function closePreloader() {
        // Fade into matching dark color instead of white
        preloader.style.background = 'linear-gradient(rgba(15,18,32,0.98), rgba(15,18,32,0.98))';
        preloader.style.opacity = '0';
        preloader.style.pointerEvents = 'none';  // allow clicks on ads underneath during fade
        
        setTimeout(() => {
            preloader.remove();
            window.location.href = 'home.html';
        }, 1200);
    }

    function showVideoAdThenClose() {
        // Prevent double-clicks
        document.getElementById('skip-preloader').style.pointerEvents = 'none';
        document.getElementById('enter-site').style.pointerEvents = 'none';

        const overlay = document.createElement('div');
        overlay.id = 'video-ad-overlay';

        const loading = document.createElement('div');
        loading.id = 'ad-loading';
        loading.textContent = 'Loading ad...';
        overlay.appendChild(loading);

        const video = document.createElement('video');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.controls = false;
        video.style.display = 'none';

        const skipBtn = document.createElement('button');
        skipBtn.id = 'ad-skip-btn';
        skipBtn.textContent = 'Skip Ad';

        overlay.appendChild(video);
        overlay.appendChild(skipBtn);
        document.body.appendChild(overlay);

        let adFinished = false;

        function finishAd() {
            if (adFinished) return;
            adFinished = true;
            try {
                video.pause();
                video.src = '';
            } catch (e) {}
            overlay.remove();
            closePreloader();
        }

        skipBtn.addEventListener('click', finishAd);
        video.addEventListener('ended', finishAd);
        video.addEventListener('error', () => {
            // If video fails, still let user through after a short delay
            setTimeout(finishAd, 1500);
        });

        // Fetch VAST and play
        fetch(VAST_AD_TAG)
            .then(r => r.text())
            .then(xmlText => {
                const parser = new DOMParser();
                const xml = parser.parseFromString(xmlText, 'text/xml');

                // Fire Impression tracking
                const impressions = xml.querySelectorAll('Impression');
                impressions.forEach(imp => {
                    const url = imp.textContent.trim();
                    if (url) {
                        const img = new Image();
                        img.src = url;
                    }
                });

                // Prefer mp4 MediaFile
                let mediaUrl = null;
                const mediaFiles = xml.querySelectorAll('MediaFile');
                for (const mf of mediaFiles) {
                    const type = (mf.getAttribute('type') || '').toLowerCase();
                    const url = mf.textContent.trim();
                    if (type.includes('mp4') && url) {
                        mediaUrl = url;
                        break;
                    }
                }
                // Fallback to first media file
                if (!mediaUrl && mediaFiles.length) {
                    mediaUrl = mediaFiles[0].textContent.trim();
                }

                // Skip offset (default 15s from this tag)
                let skipSeconds = 15;
                const linear = xml.querySelector('Linear');
                if (linear) {
                    const so = linear.getAttribute('skipoffset');
                    if (so && so.startsWith('00:00:')) {
                        const parts = so.split(':');
                        skipSeconds = parseInt(parts[2], 10) || 15;
                    }
                }

                if (!mediaUrl) {
                    loading.textContent = 'Ad unavailable';
                    setTimeout(finishAd, 2000);
                    return;
                }

                loading.remove();
                video.style.display = 'block';
                video.src = mediaUrl;
                video.muted = false;
                video.play().catch(() => {
                    // Autoplay with sound often blocked; try muted then unmute on interaction
                    video.muted = true;
                    video.play().catch(() => setTimeout(finishAd, 2000));
                });

                // Show skip button after skipoffset
                setTimeout(() => {
                    if (!adFinished) {
                        skipBtn.style.display = 'block';
                    }
                }, skipSeconds * 1000);
            })
            .catch(err => {
                console.warn('VAST load failed', err);
                loading.textContent = 'Ad unavailable';
                setTimeout(finishAd, 2000);
            });
    }

    // Button clicks now show the video ad first
    document.getElementById('skip-preloader').addEventListener('click', showVideoAdThenClose);
    document.getElementById('enter-site').addEventListener('click', showVideoAdThenClose);
}

showPreloader();
</script>
